<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="JetBrains Mono, ui-monospace, monospace">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#33FF77" stroke-opacity=".07"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#33FF77" stop-opacity=".35"/>
      <stop offset="1" stop-color="#33FF77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#33FF77" stop-opacity=".9"/>
      <stop offset="1" stop-color="#33FF77" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#060A07"/>
  <rect width="640" height="360" fill="url(#g)"/>

  <!-- Campaign core -->
  <circle cx="190" cy="180" r="110" fill="url(#glow)"/>
  <circle cx="190" cy="180" r="62" fill="#0B150E" stroke="#33FF77" stroke-width="1.5"/>
  <circle cx="190" cy="180" r="78" fill="none" stroke="#33FF77" stroke-opacity=".35" stroke-dasharray="4 6"/>
  <text x="190" y="172" fill="#CFFFE0" font-size="13" text-anchor="middle" font-weight="700">CAMPAÑA</text>
  <text x="190" y="194" fill="#33FF77" font-size="11" text-anchor="middle">en curso</text>

  <!-- Channel beams -->
  <path d="M252 150 C320 110 360 80 420 78" fill="none" stroke="url(#beam)" stroke-width="2"/>
  <path d="M252 180 H420" fill="none" stroke="url(#beam)" stroke-width="2"/>
  <path d="M252 210 C320 250 360 280 420 282" fill="none" stroke="url(#beam)" stroke-width="2"/>
  <g fill="#9DFFC0">
    <circle cx="300" cy="118" r="3"/><circle cx="350" cy="92" r="2.5"/>
    <circle cx="298" cy="180" r="3"/><circle cx="352" cy="180" r="2.5"/><circle cx="392" cy="180" r="2"/>
    <circle cx="300" cy="242" r="3"/><circle cx="352" cy="268" r="2.5"/>
  </g>

  <!-- Channels -->
  <g font-size="12" font-weight="700">
    <rect x="420" y="56" width="176" height="44" fill="#0B150E" stroke="#33FF77" stroke-opacity=".6"/>
    <text x="440" y="83" fill="#CFFFE0">SMS</text>
    <text x="580" y="83" fill="#33FF77" text-anchor="end" font-weight="400">● activo</text>

    <rect x="420" y="158" width="176" height="44" fill="#0B150E" stroke="#33FF77" stroke-opacity=".6"/>
    <text x="440" y="185" fill="#CFFFE0">WHATSAPP</text>
    <text x="580" y="185" fill="#33FF77" text-anchor="end" font-weight="400">● activo</text>

    <rect x="420" y="260" width="176" height="44" fill="#0B150E" stroke="#33FF77" stroke-opacity=".6"/>
    <text x="440" y="287" fill="#CFFFE0">EMAIL</text>
    <text x="580" y="287" fill="#33FF77" text-anchor="end" font-weight="400">● activo</text>
  </g>

  <text x="24" y="336" fill="#8FA898" font-size="10" letter-spacing="1.5">CONTACTOS · PLANTILLAS · ENTREGA EN TIEMPO REAL</text>
</svg>
